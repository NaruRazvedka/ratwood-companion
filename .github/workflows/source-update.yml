name: Propose Ratwood source update
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ratwood-source-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - run: node tools/refresh-guide.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node --test tests/*.test.cjs guide/tests/*.test.cjs
      - run: python -m unittest discover -s guide/tests -p 'test_current*.py'
      - run: node tools/propose-update.cjs
        env:
          GH_TOKEN: ${{ github.token }}
